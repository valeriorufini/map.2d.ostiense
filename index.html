<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roma — mappa urbanistica (vettoriale)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root { --paper:#ffffff; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; font-family:system-ui,sans-serif; background:var(--paper); }
    #map { width:100%; height:100%; }
    .map-title {
      position:absolute; z-index:10; top:14px; left:14px; padding:10px 13px;
      border:1px solid #c8c6c0; border-radius:3px; background:rgba(244,242,237,.94);
      color:#444844; box-shadow:0 1px 4px #00000012; font-size:13px; letter-spacing:.02em;
    }
    .map-title strong { display:block; font-size:15px; font-weight:650; }
    .map-title span { color:#777a75; font-size:11px; }
    .legend {
      position:absolute; z-index:10; right:14px; bottom:34px; background:rgba(244,242,237,.95);
      border:1px solid #c8c6c0; padding:10px 12px; color:#555; font-size:11px; line-height:1.8;
    }
    .swatch { display:inline-block; width:17px; height:8px; margin-right:7px; border:1px solid #0002; vertical-align:middle; }
    .maplibregl-ctrl-attrib { font-size:10px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="map-title"><strong>ROMA · CARTOGRAFIA URBANA</strong><span>Stile chiaro ispirato a QGIS</span></div>
  <div class="legend">
    <div><i class="swatch" style="background:#d3e4ac"></i>Parchi e aree verdi</div>
    <div><i class="swatch" style="background:#55b8e7"></i>Acqua</div>
    <div><i class="swatch" style="background:#ece3d2"></i>Commerciale, servizi, industria</div>
    <div><i class="swatch" style="background:#76756f"></i>Viabilità</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // ============ PALETTE (modifica qui) ============
    const C = {
      paper:    '#ffffff',
      green:    '#d3e4ac',
      greenDk:  '#c4d99a',
      water:    '#55b8e7',
      built:    '#e6dac7',   // isolati / aree residenziali
      built2:   '#ece3d2',   // commerciale, ospedali, scuole
      building: '#e6e4df',   // edifici: poco più scuri della base
      buildingLine: '#c4bfb4', // contorno sottile degli edifici,
      roadMain: '#5f5e5b',
      roadMed:  '#76756f',
      roadMin:  '#92918c',
      path:     '#b0afab',
      rail:     '#8c8b87'
    };
    // larghezza strade in funzione dello zoom
    const w = (a, b, c, d) => ['interpolate', ['exponential', 1.6], ['zoom'], 10, a, 13, b, 16, c, 19, d];
    const notTunnel = ['!=', ['get', 'brunnel'], 'tunnel'];
    const road = (id, classes, color, width, minzoom = 0, extra = []) => ({
      id, type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom,
      filter: ['all', ['in', ['get', 'class'], ['literal', classes]], notTunnel, ...extra],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': color, 'line-width': width }
    });

    const style = {
      version: 8,
      sources: {
        omt: {
          type: 'vector',
          url: 'https://tiles.openfreemap.org/planet',
          attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
        }
      },
      // nessun layer "symbol" => nessuna scritta (e non servono i glyphs)
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': C.paper } },

        // Aree commerciali / servizi (tono sabbia). Il residenziale NON si disegna: l'uso del suolo in OSM è incompleto e creava zone a macchia
        { id: 'landuse-built2', type: 'fill', source: 'omt', 'source-layer': 'landuse',
          filter: ['in', ['get', 'class'], ['literal', ['commercial', 'retail', 'industrial', 'hospital', 'school', 'university', 'railway']]],
          paint: { 'fill-color': C.built2, 'fill-antialias': false } },

        // Verde
        { id: 'landcover-green', type: 'fill', source: 'omt', 'source-layer': 'landcover',
          filter: ['in', ['get', 'class'], ['literal', ['grass', 'wood', 'scrub', 'wetland']]],
          paint: { 'fill-color': C.green, 'fill-antialias': false } },
        { id: 'landuse-green', type: 'fill', source: 'omt', 'source-layer': 'landuse',
          filter: ['in', ['get', 'class'], ['literal', ['cemetery', 'playground', 'pitch', 'garden', 'park', 'recreation_ground']]],
          paint: { 'fill-color': C.green, 'fill-antialias': false } },
        { id: 'park', type: 'fill', source: 'omt', 'source-layer': 'park',
          paint: { 'fill-color': C.greenDk, 'fill-opacity': 0.55, 'fill-antialias': false } },

        // Acqua
        { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water',
          paint: { 'fill-color': C.water } },
        { id: 'waterway', type: 'line', source: 'omt', 'source-layer': 'waterway',
          filter: ['in', ['get', 'class'], ['literal', ['river', 'canal']]],
          layout: { 'line-cap': 'round' },
          paint: { 'line-color': C.water, 'line-width': w(0.8, 1.6, 3, 8) } },

        // Edifici: riempimento bianco + contorno ben marcato (compaiono da zoom 14)
        { id: 'building', type: 'fill', source: 'omt', 'source-layer': 'building', minzoom: 14,
          paint: { 'fill-color': C.building, 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 14, 0, 14.8, 1], 'fill-antialias': false } },
        { id: 'building-outline', type: 'line', source: 'omt', 'source-layer': 'building', minzoom: 14,
          paint: {
            'line-color': C.buildingLine,
            'line-width': ['interpolate', ['linear'], ['zoom'], 14, 0.3, 16, 0.7, 18, 1.2, 19, 1.6],
            'line-opacity': ['interpolate', ['linear'], ['zoom'], 14, 0, 14.8, 1]
          } },

        // Ferrovia
        { id: 'rail', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 12,
          filter: ['all', ['==', ['get', 'class'], 'rail'], notTunnel],
          paint: { 'line-color': C.rail, 'line-width': w(0.4, 0.8, 1.4, 3), 'line-dasharray': [3, 2] } },

        // Strade (dal più sottile al più spesso, così le principali stanno sopra)
        road('path',     ['path', 'pedestrian', 'track'], C.path,    w(0.2, 0.5, 0.9, 2.5), 14),
        road('service',  ['service'],                     C.roadMin, w(0.2, 0.6, 1.2, 4),   14),
        road('minor',    ['minor'],                       C.roadMin, w(0.3, 1.0, 2.2, 8),   12),
        road('tertiary', ['tertiary'],                    C.roadMed, w(0.5, 1.6, 3.2, 11),  11),
        road('secondary',['secondary'],                   C.roadMed, w(0.8, 2.2, 4.2, 14),  9),
        road('primary',  ['primary', 'trunk'],            C.roadMain,w(1.2, 3.2, 5.5, 18),  6),
        road('motorway', ['motorway'],                    C.roadMain,w(1.4, 3.6, 6.0, 20),  5)
      ]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style,
      center: [12.4866, 41.8902],
      zoom: 14,
      maxZoom: 18,
      attributionControl: { compact: true }
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    // Contorno grafico indicativo del centro storico, non ufficiale.
    const centro = [
      [12.466,41.905],[12.484,41.908],[12.503,41.901],[12.508,41.890],
      [12.499,41.878],[12.482,41.876],[12.466,41.884],[12.461,41.895],[12.466,41.905]
    ];
    map.on('load', () => {
      map.addSource('centro', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: centro } } });
      map.addLayer({ id: 'centro', type: 'line', source: 'centro',
        paint: { 'line-color': '#4a4d4a', 'line-opacity': 0.6, 'line-width': 1.5, 'line-dasharray': [3, 3] } });
    });
  </script>
</body>
</html>
